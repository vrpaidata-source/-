<style>
  * { box-sizing: border-box; }
  html, body { width:100%; min-height:100%; margin:0; }
  body {
    overflow:hidden; color:#ffe8ad;
    font-family:"Noto Sans Tamil","Latha",system-ui,sans-serif;
    background:#100803;
  }
  .scene {
    position:relative; width:100%; height:100svh; min-height:540px;
    overflow:hidden; isolation:isolate; display:flex;
    align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 45%, #9a5b20 0%, #4b260e 34%, #1b0d06 72%, #090503 100%);
  }
  .sanctum {
    position:absolute; inset:0; z-index:-3;
    background:
      radial-gradient(ellipse at 50% 44%, #f8c96c44 0%, transparent 42%),
      repeating-linear-gradient(90deg, #f6c66b0a 0 3px, transparent 3px 78px),
      linear-gradient(90deg,#1b0b04,#613713 12%,#241006 25%,#160a04 50%,#241006 75%,#613713 88%,#1b0b04);
  }
  .sanctum:before {
    content:""; position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, transparent 0 78px, #e5ad4d12 79px 82px),
      radial-gradient(ellipse at 50% 48%, transparent 35%, #0009 100%);
    opacity:.9;
  }
  .ceiling-glow {
    position:absolute; z-index:-2; width:min(100vw,800px); aspect-ratio:1;
    top:4%; left:50%; transform:translateX(-50%); border-radius:50%;
    background:radial-gradient(circle,#ffe5a0 0%,#e6a43b55 20%,#a65d1b22 48%,transparent 70%);
    filter:blur(12px); animation:glow 4s ease-in-out infinite alternate;
  }
  @keyframes glow { to { opacity:.65; transform:translateX(-50%) scale(1.12); } }
  .title {
    position:absolute; top:max(14px,env(safe-area-inset-top)); z-index:8;
    width:100%; text-align:center; padding:0 10px;
    font-size:clamp(1rem,4vw,1.4rem); font-weight:800; color:#ffe6a4;
    text-shadow:0 0 12px #e9a83e,0 2px 8px #000;
  }
  .shrine {
    position:relative; width:min(76vw,490px); height:min(76svh,740px);
    min-height:390px; margin-top:8px; perspective:1400px;
    filter:drop-shadow(0 10px 30px #000c);
  }
  .inner-frame {
    position:absolute; inset:0; overflow:hidden;
    border:clamp(7px,2vw,13px) ridge #dca34c;
    border-radius:47% 47% 10px 10px / 16% 16% 10px 10px;
    background:linear-gradient(180deg,#341907,#100803 50%,#3a1d09);
    box-shadow:0 0 0 3px #ffe6a0,0 0 28px #ffc45c99,inset 0 0 35px #ffdb7c55;
  }
  .inner-frame:before {
    content:""; position:absolute; inset:10px; z-index:2; pointer-events:none;
    border:2px solid #f4ca79aa; border-radius:inherit;
    box-shadow:inset 0 0 30px #f4b84b44;
  }
  .murugan {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center center;
    opacity:0; transform:scale(1.035);
    /* கதவு திறக்கத் தொடங்கும் அதே நேரத்தில் முருகர் மெதுவாக Fade-in ஆக வேண்டும் */
    transition:opacity 2.8s ease 0s, transform 3s ease 0s;
  }
  .doors {
    position:absolute; inset:0; z-index:5; display:flex;
    border-radius:47% 47% 8px 8px / 16% 16% 8px 8px;
    overflow:hidden; transform-style:preserve-3d; pointer-events:none;
  }
  .door {
    position:relative; width:50%; height:100%;
    border:clamp(5px,1.4vw,10px) ridge #f8d889;
    background:
      repeating-linear-gradient(90deg,transparent 0 22px,#ffe6a033 23px 25px),
      linear-gradient(90deg,#62300c 0%,#d18c2f 14%,#f6d17c 25%,#98551a 42%,#e8b65b 60%,#71360e 82%,#e3aa4d 100%);
    box-shadow:inset 0 0 35px #321604,inset 0 0 0 5px #efc66b;
    transition:transform 3.2s cubic-bezier(.72,0,.2,1);
    backface-visibility:hidden;
  }
  .door:before {
    content:""; position:absolute; inset:3.5%;
    border:4px double #ffe8a8; outline:2px solid #8b4d17; outline-offset:-12px;
    border-radius:45% 45% 5px 5px / 15% 15% 5px 5px;
    background:
      radial-gradient(circle at 50% 48%,#f6d17b55 0 18%,transparent 19%),
      repeating-linear-gradient(45deg,transparent 0 25px,#ffdfa022 26px 28px),
      linear-gradient(135deg,#a65c1c99,#f7d77a55,#71340e99);
    box-shadow:inset 0 0 25px #542507;
  }
  .door:after {
    content:"✥"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:56%; aspect-ratio:1; display:grid; place-items:center;
    color:#ffe8a7; font-size:clamp(3rem,13vw,6rem);
    border:4px double #ffdf8b; border-radius:50%;
    text-shadow:0 0 14px #fff0ad; box-shadow:0 0 0 8px #7e451d88,inset 0 0 20px #5a2b0a;
  }
  .door.left { transform-origin:left center; }
  .door.right { transform-origin:right center; }
  .door.left:after { content:"ஓம்"; font-size:clamp(1.5rem,6vw,3rem); }
  .door.right:after { content:"வேல்"; font-size:clamp(1.4rem,5.5vw,2.6rem); }
  .door-offering {
    position:absolute; z-index:7; left:50%; top:calc(100% + 8px);
    transform:translateX(-50%); width:min(96%,420px); text-align:center;
    color:#ffd76b; font-size:clamp(.9rem,3.5vw,1.3rem); font-weight:900;
    letter-spacing:.2px; line-height:1.4; padding:4px 6px;
    text-shadow:0 0 5px #8a4b08,0 0 12px #f6c75b,0 2px 4px #000;
    pointer-events:none; opacity:1; transition:opacity .55s ease;
  }
  .door-offering[hidden] { display:none; }
  .doors.open + .door-offering { opacity:0; }
  .doors.open .left { transform:rotateY(-112deg); }
  .doors.open .right { transform:rotateY(112deg); }
  .scene.revealed .murugan { opacity:1; transform:scale(1); }
  .lamp {
    position:absolute; z-index:6; top:50%; transform:translateY(-50%);
    width:clamp(65px,15vw,145px); height:min(62svh,590px);
    pointer-events:none; filter:drop-shadow(0 0 12px #ffb83f99);
  }
  .lamp.left { left:clamp(0px,1vw,18px); }
  .lamp.right { right:clamp(0px,1vw,18px); }
  .lamp svg { width:100%; height:100%; overflow:visible; }
  .flame { transform-origin:center bottom; animation:flicker .16s ease-in-out infinite alternate; }
  .flame:nth-child(2n) { animation-duration:.23s; }
  .flame:nth-child(3n) { animation-duration:.19s; }
  @keyframes flicker {
    0% { transform:scale(.88,1.05) rotate(-3deg); opacity:.82; }
    50% { transform:scale(1.08,.92) rotate(2deg); opacity:1; }
    100% { transform:scale(.96,1.13) rotate(-1deg); opacity:.9; }
  }
  .caption {
    position:absolute; z-index:8; bottom:clamp(145px,20vh,180px);
    width:100%; padding:0 10px; text-align:center;
    color:#ffe8ad; font-weight:900; font-size:clamp(1.05rem,4.8vw,1.65rem);
    letter-spacing:.2px; text-shadow:0 0 8px #fff0b0,0 0 18px #e49a2e,0 3px 8px #000;
    opacity:0; transform:translateY(10px); transition:opacity 1.2s ease 3.5s,transform 1.2s ease 3.5s;
  }
  .scene.revealed .caption { opacity:1; transform:translateY(0); }
  .share-panel {
    position:absolute; z-index:10; left:50%; bottom:max(12px,env(safe-area-inset-bottom));
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .7s ease, visibility 0s linear .7s;
    transform:translateX(-50%); width:min( min(92vw,390px), calc(100% - 24px));
    padding:10px 12px; border:1px solid #d9a84e; border-radius:16px;
    background:linear-gradient(145deg,rgba(42,20,7,.96),rgba(13,7,3,.96));
    box-shadow:0 5px 22px #000b; text-align:center;
  }
  .share-panel.visible {
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .7s ease;
  }
  .sender-label { display:block; color:#ffe6a0; font-size:.82rem; font-weight:700; margin-bottom:5px; }
  .sender-input { width:100%; padding:9px 11px; border:1px solid #c9953d; border-radius:9px;
    background:#fff8e8; color:#281506; font-family:inherit; font-size:16px; font-weight:600; outline:none; }
  .wish-preview { color:#fff0c6; font-size:.83rem; line-height:1.45; margin:7px 2px 9px; min-height:36px; }
  .share { border:1px solid #ffe5a0; border-radius:24px; padding:8px 22px;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    color:#3b2108; background:linear-gradient(135deg,#fff0b5,#d99a35);
    box-shadow:0 3px 15px #0008; font-family:inherit; font-size:.9rem; font-weight:700; cursor:pointer; }
  .share:active { transform:scale(.96); }
  .share:disabled { opacity:.55; cursor:wait; }
  .share svg { width:16px; height:16px; }
  .particles { position:absolute; inset:0; z-index:7; overflow:hidden; pointer-events:none; }
  .spark {
    position:absolute; bottom:-12px; width:3px; height:3px; border-radius:50%;
    background:#fff0b2; box-shadow:0 0 7px 2px #ffc34d,0 0 14px #ffb52e;
    opacity:0; animation:rise var(--dur) linear infinite; animation-delay:var(--delay);
  }
  @keyframes rise {
    0% { transform:translate3d(0,0,0) scale(.5); opacity:0; }
    12% { opacity:.9; } 85% { opacity:.7; }
    100% { transform:translate3d(var(--drift),-110vh,0) scale(1.3); opacity:0; }
  }
  @media(max-width:430px) {
    .shrine { width:76vw; height:min(72svh,670px); }
    .lamp { width:15vw; height:53svh; }
    .lamp.left { left:-1vw; } .lamp.right { right:-1vw; }
    .caption { bottom:clamp(145px,20vh,170px); }
  }
  @media(max-height:650px) {
    .shrine { height:68svh; min-height:300px; }
    .lamp { height:55svh; }
    .caption { bottom:145px; }
  }
  @media(prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>

    </div>
    <div class="doors" id="doors">
      <div class="door left"></div><div class="door right"></div>
    </div>
    <div class="door-offering" id="doorOffering" hidden></div>
  </section>

  <div class="particles" id="particles" aria-hidden="true"></div>
  <div class="caption">கருணைக் கடலே கந்தா போற்றி 🙏</div>
  <section class="share-panel" aria-label="வாழ்த்து பகிர்வு">
    <label class="sender-label" for="senderName">உங்கள் பெயரை உள்ளிடுங்கள்</label>
    <input class="sender-input" id="senderName" type="text" maxlength="50" autocomplete="name" placeholder="அனுப்புநர் பெயர்">
    <div class="wish-preview" id="wishPreview" aria-live="polite">உங்கள் பெயரை உள்ளிட்டதும் வாழ்த்து உருவாகும்.</div>
    <button class="share" id="shareBtn" type="button" aria-label="வாழ்த்தை அனுப்பவும்">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/>
      </svg>
      Sent
    </button>
  </section>
</main>
<script>
  const scene = document.getElementById('scene');
  const doors = document.getElementById('doors');
  const layer = document.getElementById('particles');
  const caption = document.querySelector('.caption');
  const sharePanel = document.querySelector('.share-panel');
  const doorOffering = document.getElementById('doorOffering');
  const incomingName = new URLSearchParams(window.location.search).get('name');
  if (incomingName && incomingName.trim()) {
    doorOffering.textContent = `உபயம் :- ${incomingName.trim()}`;
    doorOffering.hidden = false;
  }

  for (let i = 0; i < 48; i++) {
    const p = document.createElement('i');
    p.className = 'spark';
    p.style.left = (Math.random() * 100) + '%';
    p.style.setProperty('--dur', (7 + Math.random() * 9) + 's');
    p.style.setProperty('--delay', (-Math.random() * 15) + 's');
    p.style.setProperty('--drift', ((Math.random() - .5) * 140) + 'px');
    p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
    layer.appendChild(p);
  }

  function openSanctum() {
    scene.classList.remove('revealed');
    doors.classList.remove('open');
    window.setTimeout(() => {
      doors.classList.add('open');
      scene.classList.add('revealed');
      // Caption fully appears (3.5s delay + 1.2s fade); show sender form 2s later.
      window.setTimeout(() => sharePanel.classList.add('visible'), 6700);
    }, 500);
  }
  window.addEventListener('load', openSanctum);

  const senderInput = document.getElementById('senderName');
  const wishPreview = document.getElementById('wishPreview');
  const shareButton = document.getElementById('shareBtn');
  const shareUrl = 'https://vrpaidata-source.github.io/-/';

  function makeWish(name) {
    return `🙏 ${name} சார்பாக தங்கக் கருவறையில் முருகப்பெருமானின் தெய்வீக தரிசனம்.\n\nவெற்றிவேல் முருகனுக்கு அரோகரா! உங்கள் வாழ்வில் எல்லா நலன்களும் வளங்களும் பெருகட்டும்.\n\nஅன்புடன், ${name}`;
  }
  senderInput.addEventListener('input', () => {
    const name = senderInput.value.trim();
    wishPreview.textContent = name ? makeWish(name) : 'உங்கள் பெயரை உள்ளிட்டதும் வாழ்த்து உருவாகும்.';
  });

  shareButton.addEventListener('click', async () => {
    const name = senderInput.value.trim();
    if (!name) {
      wishPreview.textContent = 'முதலில் உங்கள் பெயரை உள்ளிடுங்கள்.';
      senderInput.focus();
      return;
    }
    const personalizedUrl = new URL(shareUrl);
    personalizedUrl.searchParams.set('name', name);
    const shareData = {
      title: 'கருணைக் கடலே கந்தா போற்றி',
      text: makeWish(name),
      url: personalizedUrl.toString()
    };
    shareButton.disabled = true;
    shareButton.textContent = 'திறக்கிறது…';
    try {
      if (navigator.share) {
        await navigator.share(shareData);
      } else if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(`${shareData.text}\n${shareData.url}`);
        alert('வாழ்த்தும் இணைப்பும் நகலெடுக்கப்பட்டது. இப்போது பகிரலாம்.');
      } else {
        window.prompt('இந்த வாழ்த்தையும் இணைப்பையும் நகலெடுத்து பகிரவும்:', `${shareData.text}\n${shareData.url}`);
      }
    } catch (err) {
      if (err.name !== 'AbortError') {
        window.prompt('இந்த வாழ்த்தையும் இணைப்பையும் நகலெடுத்து பகிரவும்:', `${shareData.text}\n${shareData.url}`);
      }
    } finally {
      // Share sheet மூடப்பட்டதும் அடுத்த நபருக்காக முதல் நிலைக்கு திரும்பும்.
      senderInput.value = '';
      wishPreview.textContent = 'உங்கள் பெயரை உள்ளிட்டதும் வாழ்த்து உருவாகும்.';
      shareButton.disabled = false;
      shareButton.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg> Sent';
    }
  });
</script>
</body>
</html>
